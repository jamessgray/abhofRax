<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hofkarte Semmering-Rax </title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>


<header>
  <div class="logo">
    <div class="logo-icon">🌾</div>
    Hofkarte
  </div>
  <span class="header-sub">Direktvermarkter und Ab Hof Verkauf im Semmering-Rax Gebiet</span>
</header>

<div class="filter-bar" id="filterBar">
  <span class="filter-label">Products:</span>
  <button class="chip chip-all active" onclick="filterAll(this)">Alle Höfe</button>
  <button class="chip" onclick="filterByBio(this)">Bio Betriebe</button>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Resultate</span>
      <span class="count-badge" id="countBadge">0 gezeigt</span>
    </div>
    <div class="cards-list" id="cardsList"></div>
  </div>
  <div style="position:relative;flex:1;display:flex;flex-direction:column;">
    <div id="map" style="flex:1;width:100%;"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="empty-icon">🗺️</div>
      <div class="empty-text">Keine passende Resultate gefunden</div>
      <div class="empty-sub">Versuchen Sie es mit einer anderen Suchanfrage</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
