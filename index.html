<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hofkarte Semmering-Rax </title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --ink: #1e1a14;
    --earth: #7a5c3a;
    --sage: #6b7c5e;
    --straw: #c9a84c;
    --mist: #e8e2d6;
    --rust: #b85c38;
    --panel: #faf7f2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    height: 58px;
    background: var(--ink);
    flex-shrink: 0;
    z-index: 1000;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.35rem;
    color: var(--cream);
    letter-spacing: 0.01em;
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .logo-icon {
    width: 28px; height: 28px;
    background: var(--straw);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  .header-sub {
    font-size: 0.78rem;
    color: #9a9082;
    font-weight: 300;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .load-btn {
    background: transparent;
    border: 1px solid #4a4035;
    color: #c8b89a;
    padding: 6px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 3px;
  }
  .load-btn:hover { background: #2e2820; color: var(--cream); }
  #csvInput { display: none; }

  /* ── FILTER BAR ── */
  .filter-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 28px;
    background: var(--panel);
    border-bottom: 1px solid var(--mist);
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }

  .filter-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--earth);
    font-weight: 500;
    white-space: nowrap;
    margin-right: 4px;
  }

  .chip {
    padding: 5px 13px;
    border-radius: 20px;
    border: 1.5px solid var(--mist);
    background: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    color: #5a5040;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.18s;
    font-weight: 400;
  }
  .chip:hover { border-color: var(--sage); color: var(--sage); }
  .chip.active {
    background: var(--sage);
    border-color: var(--sage);
    color: white;
    font-weight: 500;
  }
  .chip-all.active {
    background: var(--ink);
    border-color: var(--ink);
    color: white;
  }

  /* ── MAIN LAYOUT ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 340px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--mist);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--mist);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .sidebar-title {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: var(--ink);
  }

  .count-badge {
    font-size: 0.75rem;
    color: #9a8c7a;
    font-weight: 300;
  }

  .cards-list {
    overflow-y: auto;
    flex: 1;
    padding: 10px 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--mist) transparent;
  }

  .farm-card {
    background: white;
    border: 1.5px solid var(--mist);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 9px;
    cursor: pointer;
    transition: all 0.18s;
    position: relative;
  }
  .farm-card:hover, .farm-card.active {
    border-color: var(--sage);
    box-shadow: 0 2px 12px rgba(107,124,94,0.12);
  }
  .farm-card.active { border-color: var(--earth); }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 0.95rem;
    color: var(--ink);
    margin-bottom: 4px;
  }

  .card-address {
    font-size: 0.76rem;
    color: #9a8c7a;
    font-weight: 300;
    margin-bottom: 8px;
    font-style: italic;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .tag {
    font-size: 0.68rem;
    padding: 2px 8px;
    background: #f0ede6;
    border-radius: 10px;
    color: var(--earth);
    font-weight: 500;
    letter-spacing: 0.02em;
    text-transform: capitalize;
  }

  .card-contact {
    margin-top: 8px;
    font-size: 0.74rem;
    color: var(--sage);
    font-weight: 400;
  }
  .card-contact a { color: var(--sage); text-decoration: none; }
  .card-contact a:hover { text-decoration: underline; }

  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: #b0a898;
    font-size: 0.85rem;
    font-style: italic;
  }

  /* ── MAP ── */
  #map {
    flex: 1;
    z-index: 1;
    width: 100%;
    height: 100%;
    min-height: 400px;
  }

  /* ── LEAFLET OVERRIDES ── */
  .leaflet-popup-content-wrapper {
    border-radius: 8px;
    border: 1.5px solid var(--mist);
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    font-family: 'DM Sans', sans-serif;
    padding: 0;
    overflow: hidden;
  }
  .leaflet-popup-content { margin: 0; width: 220px !important; }
  .popup-inner { padding: 14px 16px; }
  .popup-name {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .popup-addr { font-size: 0.75rem; color: #9a8c7a; font-style: italic; margin-bottom: 8px; }
  .popup-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 8px; }
  .popup-contact { font-size: 0.74rem; color: var(--sage); }
  .popup-contact a { color: var(--sage); }

  .leaflet-popup-tip { background: white; }

  /* Custom marker */
  .farm-marker {
    width: 32px; height: 32px;
    background: var(--sage);
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2.5px solid white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }
  .farm-marker.active {
    background: var(--earth);
    transform: rotate(-45deg) scale(1.2);
  }
  .farm-marker:hover { background: var(--straw); }

  /* ── EMPTY STATE ── */
  .empty-state {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 500;
    pointer-events: none;
  }
  .empty-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }
  .empty-text { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--earth); opacity: 0.6; }
  .empty-sub { font-size: 0.8rem; color: #b0a898; margin-top: 6px; font-style: italic; }

  /* ── DEMO BANNER ── */
  .demo-banner {
    background: var(--straw);
    color: var(--ink);
    text-align: center;
    font-size: 0.76rem;
    padding: 5px;
    letter-spacing: 0.03em;
  }
  .demo-banner strong { font-weight: 600; }

  /* ── SCROLLBAR ── */
  .cards-list::-webkit-scrollbar { width: 4px; }
  .cards-list::-webkit-scrollbar-track { background: transparent; }
  .cards-list::-webkit-scrollbar-thumb { background: var(--mist); border-radius: 2px; }
</style>
</head>
<body>


<header>
  <div class="logo">
    <div class="logo-icon">🌾</div>
    Hofkarte
  </div>
  <span class="header-sub">Direktvermarkter und Ab Hof Verkauf im Semmering-Rax Gebiet</span>
</header>

<div class="filter-bar" id="filterBar">
  <span class="filter-label">Products:</span>
  <button class="chip chip-all active" onclick="filterAll(this)">All farms</button>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Resultate</span>
      <span class="count-badge" id="countBadge">0 gezeigt</span>
    </div>
    <div class="cards-list" id="cardsList"></div>
  </div>
  <div style="position:relative;flex:1;display:flex;flex-direction:column;">
    <div id="map" style="flex:1;width:100%;"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="empty-icon">🗺️</div>
      <div class="empty-text">Keine passende Resultate gefunden</div>
      <div class="empty-sub">Versuchen Sie es mit einer anderen Suchanfrage</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>



// ── STATE ──────────────────────────────────────────────────────────────────
let farms = [];
let markers = {};
let activeFilter = null;
let activeCard = null;
let map;

// ── MAP INIT ───────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  map = L.map('map', { zoomControl: true }).setView([48.35, 15.90], 11);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);

  loadCSVFile('farms.csv');
  setTimeout(() => map.invalidateSize(), 100);
});

async function loadCSVFile(path) {
  try {
    const response = await fetch(path);
    if (!response.ok) {
      throw new Error(`HTTP error ${response.status}`);
    }
    const text = await response.text();
    const data = parseCSV(text);
    loadData(data);
  } catch (err) {
    console.error('Failed to load CSV:', err);
    alert('Could not load farm data.');
  }
}

// ── LOAD & RENDER ──────────────────────────────────────────────────────────
function loadData(data) {
  farms = data;
  clearAll();
  buildFilters();
  renderAll(farms);
  if (farms.length) fitMap(farms);
}

function clearAll() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  document.getElementById('cardsList').innerHTML = '';
  // reset filter chips except first two
  const bar = document.getElementById('filterBar');
  while (bar.children.length > 2) bar.removeChild(bar.lastChild);
  activeFilter = null;
  activeCard = null;
  document.querySelector('.chip-all').classList.add('active');
}

function buildFilters() {
  const bar = document.getElementById('filterBar');
  const allProducts = new Set();
  farms.forEach(f => {
    f.products.map(p => p.trim()).filter(Boolean).forEach(p => allProducts.add(p));
  });
  [...allProducts].sort().forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = PRODUCT_LABELS[p] || p;
    btn.onclick = () => filterByProduct(p, btn);
    bar.appendChild(btn);
  });
}

function renderAll(subset) {
  const list = document.getElementById('cardsList');
  list.innerHTML = '';
  document.getElementById('countBadge').textContent = `${subset.length} angezeigt`;
  document.getElementById('emptyState').style.display = subset.length ? 'none' : 'block';

  subset.forEach((farm, i) => {
    // Card
    const card = document.createElement('div');
    card.className = 'farm-card';
    card.id = `card-${i}`;
    card.innerHTML = cardHTML(farm);
    card.onclick = () => selectFarm(farm, i);
    list.appendChild(card);

    // Marker
    const icon = L.divIcon({
      className: '',
      html: `<div class="farm-marker" id="marker-icon-${i}"></div>`,
      iconSize: [32, 32],
      iconAnchor: [10, 32],
      popupAnchor: [6, -34]
    });

    const marker = L.marker([farm.lat, farm.lng], { icon }).addTo(map);
    marker.bindPopup(popupHTML(farm));
    marker.on('click', () => selectFarm(farm, i));
    markers[i] = marker;
  });
}

function cardHTML(f) {
  const contact = [];
  if (f.phone) contact.push(`<span> ${f.phone}</span>`);
  if (f.email) contact.push(`<a href="mailto:${f.email}"> ${f.email}</a>`);
  if (f.website) contact.push(`<a href="https://${f.website}" target="_blank"> ${f.website}</a>`);
  return `
    <div class="card-name">${f.name}</div>
    <div class="card-address">${f.address}</div>
    <div class="card-tags">${tags}</div>
    ${contact.length ? `<div class="card-contact">${contact.join(' · ')}</div>` : ''}
  `;
}

function popupHTML(f) {
  const contact = [];
  if (f.phone) contact.push(f.phone);
  if (f.email) contact.push(`<a href="mailto:${f.email}">${f.email}</a>`);
  if (f.website) contact.push(`<a href="https://${f.website}" target="_blank">${f.website}</a>`);
  return `<div class="popup-inner">
    <div class="popup-name">${f.name}</div>
    <div class="popup-addr">${f.address}</div>
    <div class="popup-tags">${tags}</div>
    ${contact.length ? `<div class="popup-contact">${contact.join('<br>')}</div>` : ''}
  </div>`;
}

const PRODUCT_LABELS = {
  eggs: "Eier",
  honey: "Honig",
  vegetables: "Gemüse",
  milk: "Milch",
  meat: "Fleisch",
  cheese: "Käse",
  yoghurt: "Joghurt",
  alcohol: "Alkoholische Getränke",
  juice: "Säfte",
  fish: "Fisch"
};



// ── SELECT ─────────────────────────────────────────────────────────────────
function selectFarm(farm, i) {
  // Deselect old
  if (activeCard !== null) {
    const oldCard = document.getElementById(`card-${activeCard}`);
    if (oldCard) oldCard.classList.remove('active');
    const oldIcon = document.getElementById(`marker-icon-${activeCard}`);
    if (oldIcon) oldIcon.classList.remove('active');
  }

  activeCard = i;
  const card = document.getElementById(`card-${i}`);
  if (card) {
    card.classList.add('active');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  const icon = document.getElementById(`marker-icon-${i}`);
  if (icon) icon.classList.add('active');

  map.setView([farm.lat, farm.lng], 14, { animate: true });
  markers[i].openPopup();
}

// ── FILTER ─────────────────────────────────────────────────────────────────
function filterAll(btn) {
  activeFilter = null;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  renderAll(farms);
  fitMap(farms);
}

function filterByProduct(product, btn) {
  activeFilter = product;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  const filtered = farms.filter(f =>
    f.products.map(p => p.trim()).includes(product)
  );
  renderAll(filtered);
  if (filtered.length) fitMap(filtered);
}

function fitMap(subset) {
  const bounds = L.latLngBounds(subset.map(f => [f.lat, f.lng]));
  map.fitBounds(bounds, { padding: [40, 40] });
}

// ── CSV LOADING ────────────────────────────────────────────────────────────
function loadCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const data = parseCSV(text);
    if (data.length === 0) {
      alert('No valid rows found. Check your CSV format matches the template.');
      return;
    }
    document.querySelector('.demo-banner').style.display = 'none';
    loadData(data);
  };
  reader.readAsText(file);
  event.target.value = '';
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/\s+/g,'_').replace(/"/g,''));
  return lines.slice(1).map(line => {
    const vals = splitCSVLine(line);
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i] || '').trim().replace(/^"|"$/g, ''));
    return {
      name: obj.name || obj.farm_name || '',
      address: obj.address || '',
      lat: parseFloat(obj.lat || obj.latitude || 0),
      lng: parseFloat(obj.lng || obj.lon || obj.longitude || 0),
      phone: obj.phone || obj.tel || '',
      email: obj.email || '',
      website: obj.website || obj.web || '',

     products: Object.keys(PRODUCT_LABELS)
    .filter(key => obj[key] === '1')

    };
  }).filter(f => f.name && !isNaN(f.lat) && !isNaN(f.lng) && f.lat !== 0);
}

function splitCSVLine(line) {
  const result = [];
  let cur = '', inQ = false;
  for (const ch of line) {
    if (ch === '"') { inQ = !inQ; }
    else if (ch === ',' && !inQ) { result.push(cur); cur = ''; }
    else cur += ch;
  }
  result.push(cur);
  return result;
}


</script>
</body>
</html>
